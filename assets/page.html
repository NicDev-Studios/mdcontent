<!doctype html>
<html lang="{{language}}" data-theme="{{theme}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="{{description}}"><title>{{title}} · {{site_title}}</title>{{favicon}}<script>try{if({{switcher_enabled}}){let t=localStorage.getItem('mdcontent-theme');if(['light','dark','system'].includes(t))document.documentElement.dataset.theme=t}}catch(e){}</script><link rel="stylesheet" href="{{base}}style.css"><style>:root{--accent:{{accent}}}</style>{{custom}}<script defer src="{{base}}search.js" data-base="{{base}}"></script></head>
<body><a class="skip" href="#main">Skip to content</a><header class="top"><a class="brand" href="{{base}}">{{logo_markup}}<span>{{site_title}}</span></a><div class="top-actions"><nav class="header-links" aria-label="Links">{{header_links}}</nav>{{switcher}}</div></header><div class="layout"><aside class="sidebar">{{search_markup}}<div class="nav-label">{{navigation_label}}</div><nav aria-label="Documentation">{{nav}}</nav></aside><main id="main"><div class="eyebrow">{{navigation_label}} <span>/</span> {{title}}</div><article>{{content}}</article><footer class="page-end">{{footer}}</footer></main></div></body></html>
